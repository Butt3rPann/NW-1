server {
	listen 80;
	server_name ip24nw1.sit.kmutt.ac.th;

	location / {
		root /usr/share/nginx/html;
        	index index.html;
		try_files $uri $uri/ /index.html;
	}

	location /itb-mshop/ {
		proxy_pass http://api-server:8080/itb-mshop/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
}
